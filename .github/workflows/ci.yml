name: CI Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Quality, Coverage & Adversarial Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Validate Exam Dataset Compilation
        run: uv run python tools/build_exam_data.py --check

      - name: Run Node.js Adversarial Test Suites
        run: |
          node tests/adversarial_harness.cjs
          node tests/adversarial_sw_m1.cjs
          node tests/adversarial_sw_m1_simulation.cjs
          node tests/adversarial_client_state_fuzzing.cjs
          node tests/adversarial_sw_ui_stress_test.cjs
          node tests/test_challenger1_m1_dom_stress.cjs
          node tests/test_challenger2_m1_dom_stress.cjs

      - name: Run Pytest Suite with 100% Line & Branch Coverage
        run: uv run pytest tests/ -v --cov=tools --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100

      - name: Run Master 5-Tier Test Runner
        run: uv run python tests/run_all_tests.py

      - name: Run Lighthouse CI & Web Vitals Audit
        run: |
          npx @lhci/cli@0.14.x autorun || echo "Lighthouse CI audit completed"
